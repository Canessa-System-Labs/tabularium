<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 416" width="1200" height="416" role="img" aria-label="What it does: Know what needs you; Decide with the facts in front of you; Trust the status; Release with evidence">
<title>What it does: Know what needs you; Decide with the facts in front of you; Trust the status; Release with evidence</title>
<style>.c0{opacity:0;animation:in .7s 0.00s ease-out forwards}.c1{opacity:0;animation:in .7s 0.15s ease-out forwards}.c2{opacity:0;animation:in .7s 0.30s ease-out forwards}.c3{opacity:0;animation:in .7s 0.45s ease-out forwards}@keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}@media (prefers-reduced-motion: reduce){*{animation-duration:1ms!important;animation-delay:0s!important;animation-iteration-count:1!important;animation-fill-mode:forwards!important}}</style>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1f2125"/><stop offset="1" stop-color="#18191c"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2dd4bf"/><stop offset=".5" stop-color="#818cf8"/><stop offset="1" stop-color="#c084fc"/></linearGradient>
  <radialGradient id="glow" cx=".82" cy=".1" r=".9"><stop offset="0" stop-color="#818cf8" stop-opacity=".22"/><stop offset="1" stop-color="#818cf8" stop-opacity="0"/></radialGradient>
  <radialGradient id="glow2" cx=".1" cy="1" r=".7"><stop offset="0" stop-color="#2dd4bf" stop-opacity=".14"/><stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/></radialGradient>
  
</defs>
<rect width="1200" height="416" rx="28" fill="url(#bg)"/>
<rect width="1200" height="416" rx="28" fill="url(#glow)"/>
<rect width="1200" height="416" rx="28" fill="url(#glow2)"/>
<rect x=".5" y=".5" width="1199" height="415" rx="27.5" fill="none" stroke="rgba(255,255,255,0.13)"/>
<g class="c0"><rect x="64.0" y="48" width="526" height="150" rx="18" fill="rgba(255,255,255,.045)" stroke="rgba(255,255,255,0.13)"/><rect x="88.0" y="74" width="28" height="4" rx="2" fill="#e8835a"/><text x="88.0" y="110" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#f5f5f7" text-anchor="start" letter-spacing="-0.3">Know what needs you</text><text x="88.0" y="140" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#94a3b8" text-anchor="start" letter-spacing="0">The requests waiting for your decision and agent work ready</text><text x="88.0" y="162" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#94a3b8" text-anchor="start" letter-spacing="0">for review, in one Console on any device.</text></g><g class="c1"><rect x="610.0" y="48" width="526" height="150" rx="18" fill="rgba(255,255,255,.045)" stroke="rgba(255,255,255,0.13)"/><rect x="634.0" y="74" width="28" height="4" rx="2" fill="#e8835a"/><text x="634.0" y="110" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#f5f5f7" text-anchor="start" letter-spacing="-0.3">Decide with the facts in front of you</text><text x="634.0" y="140" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#94a3b8" text-anchor="start" letter-spacing="0">Each request carries its card (value, scope, risk, rollback);</text><text x="634.0" y="162" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#94a3b8" text-anchor="start" letter-spacing="0">a decision commits its effect, or nothing.</text></g><g class="c2"><rect x="64.0" y="218" width="526" height="150" rx="18" fill="rgba(255,255,255,.045)" stroke="rgba(255,255,255,0.13)"/><rect x="88.0" y="244" width="28" height="4" rx="2" fill="#e8835a"/><text x="88.0" y="280" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#f5f5f7" text-anchor="start" letter-spacing="-0.3">Trust the status</text><text x="88.0" y="310" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#94a3b8" text-anchor="start" letter-spacing="0">Any change that skips a rule or was made against an old</text><text x="88.0" y="332" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#94a3b8" text-anchor="start" letter-spacing="0">version is refused by name, never silently overwritten.</text></g><g class="c3"><rect x="610.0" y="218" width="526" height="150" rx="18" fill="rgba(255,255,255,.045)" stroke="rgba(255,255,255,0.13)"/><rect x="634.0" y="244" width="28" height="4" rx="2" fill="#e8835a"/><text x="634.0" y="280" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#f5f5f7" text-anchor="start" letter-spacing="-0.3">Release with evidence</text><text x="634.0" y="310" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#94a3b8" text-anchor="start" letter-spacing="0">Ten gates per milestone, each with evidence, then the owner&#x27;s</text><text x="634.0" y="332" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#94a3b8" text-anchor="start" letter-spacing="0">release decision: releases you can audit.</text></g>
</svg>
