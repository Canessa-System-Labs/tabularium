<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="1200" height="460" role="img" aria-label="Tabularium: Governed work ledger. One record for you and every agent. Agents mark work ready; only you close it.">
<title>Tabularium: Governed work ledger. One record for you and every agent. Agents mark work ready; only you close it.</title>
<style>.up{opacity:0;animation:up .8s ease-out forwards}.u1{animation-delay:.2s}.u2{animation-delay:.45s}.u3{animation-delay:.7s}.u4{animation-delay:.95s}@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}.halo{transform-origin:950px 230px;animation:halo 5s ease-in-out infinite}@keyframes halo{0%,100%{opacity:.35;transform:scale(.94)}50%{opacity:.75;transform:scale(1.04)}}.mk{opacity:0;transform-origin:950px 230px;animation:mk 1.2s .3s cubic-bezier(.2,.9,.3,1.2) forwards,float 7s 1.5s ease-in-out infinite}@keyframes mk{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:scale(1)}}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}.ring{transform-origin:950px 230px;animation:spin 40s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}@media (prefers-reduced-motion: reduce){*{animation-duration:1ms!important;animation-delay:0s!important;animation-iteration-count:1!important;animation-fill-mode:forwards!important}}</style>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1f2125"/><stop offset="1" stop-color="#18191c"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2dd4bf"/><stop offset=".5" stop-color="#818cf8"/><stop offset="1" stop-color="#c084fc"/></linearGradient>
  <radialGradient id="glow" cx=".82" cy=".1" r=".9"><stop offset="0" stop-color="#818cf8" stop-opacity=".22"/><stop offset="1" stop-color="#818cf8" stop-opacity="0"/></radialGradient>
  <radialGradient id="glow2" cx=".1" cy="1" r=".7"><stop offset="0" stop-color="#2dd4bf" stop-opacity=".14"/><stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/></radialGradient>
  <radialGradient id="aura" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#e8835a" stop-opacity=".45"/><stop offset="1" stop-color="#e8835a" stop-opacity="0"/></radialGradient>
</defs>
<rect width="1200" height="460" rx="28" fill="url(#bg)"/>
<rect width="1200" height="460" rx="28" fill="url(#glow)"/>
<rect width="1200" height="460" rx="28" fill="url(#glow2)"/>
<rect x=".5" y=".5" width="1199" height="459" rx="27.5" fill="none" stroke="rgba(255,255,255,0.13)"/>
<g class="up u1"><text x="72" y="120" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="600" fill="#e8835a" text-anchor="start" letter-spacing="3">GOVERNED WORK LEDGER</text></g><g class="up u2"><text x="70" y="210" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="84" font-weight="700" fill="#f5f5f7" text-anchor="start" letter-spacing="-3">Tabularium</text></g><g class="up u3"><rect x="74" y="236" width="140" height="4" rx="2" fill="#e8835a"/></g><g class="up u4"><text x="72" y="286" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#94a3b8" text-anchor="start" letter-spacing="0">One record for you and every agent. Agents mark work</text></g><g class="up u4"><text x="72" y="318" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#94a3b8" text-anchor="start" letter-spacing="0">ready; only you close it.</text></g><circle class="halo" cx="950" cy="230" r="190" fill="url(#aura)"/><circle class="ring" cx="950" cy="230" r="170" fill="none" stroke="rgba(255,255,255,0.13)" stroke-dasharray="2 10"/><g class="mk"><svg x="830" y="110" width="240" height="240" color="#e8835a" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.6"><rect x="12" y="8" width="40" height="48" rx="5"/><path d="M20 20h24M20 30h24M20 40h12"/><path class="acc" d="M37 42l4 4 8-9" stroke-width="3"/></svg></g>
</svg>
